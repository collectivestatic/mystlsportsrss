
name: Update STL Sports RSS Feed

on:
  schedule:
    # Runs daily at 13:00 UTC (~8:00 AM Central during daylight saving).
    # Adjust for your preferred time / for standard vs. daylight time.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate feed
        run: python generate_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Update RSS feed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
